[project]
name = "carrot-guide"
version = "0.1.0"
description = "MAVLink guidance laws flown against an ArduPilot SITL simulator"
requires-python = ">=3.11"
dependencies = [
    "pymavlink>=2.4.42",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "memray>=1.11"]

[project.scripts]
carrot-guide = "carrot_guide.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import from the source tree directly, so the unit tests run in a bare checkout
# without an install step. `tests` is a package, because mirroring the source gives
# `guidance/unit/test_hold.py` and `guidance/integration/test_hold.py` the same
# basename and only a package makes those two different modules.
pythonpath = ["src"]
# Every test carries its kind as a decorator; --strict-markers is what turns a typo
# there into an error instead of a test that belongs to no kind.
addopts = ["--strict-markers"]
markers = [
    "unit: one module or package, in isolation",
    "component: several modules wired together in process, still no simulator",
    "smoke: goes through the installed console script rather than the source tree",
    "integration: needs a running ArduPilot SITL instance",
]
